<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Compete Widget 2.0 · Klue</title>
<meta name="description" content="Compete Widget 2.0 brings deal-specific intelligence straight into the opportunity your reps are already working in."/>
<link rel="stylesheet" href="colors_and_type.css"/>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css"/>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css"/>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css"/>
<style>
  html, body { margin: 0; padding: 0; background: #fff; }
  *, *::before, *::after { box-sizing: border-box; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="image-slot.js"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="env,react">
const { useState } = React;

// ─── ASSETS ───────────────────────────────────────────────────────────────────
const ASSETS = {
  sfWidget:      'assets/images/salesforce-klue-widget.png',
  widgetPanel:   'assets/images/widget-proof-points.png',   // high-res crop
  mascot:        'assets/images/mascot-agent.png',
  wordmarkBlack: 'assets/logos/klue-wordmark.svg',
  wordmarkWhite: 'assets/logos/klue-wordmark-white.svg',
  demoVideo:     'assets/videos/klue-in-action.mp4',
};

// ─── K-MARK SVG ───────────────────────────────────────────────────────────────
const KMark = ({ size = 14, color = '#00CCFF' }) => (
  <svg width={size * (48.271 / 66.855)} height={size} viewBox="0 0 48.271 66.855" fill="none" style={{ display: 'block' }}>
    <path d="M 0.265 31.011 C -0.122 30.547 -0.08 29.862 0.361 29.449 L 31.479 0.308 C 31.69 0.11 31.969 0 32.259 0 L 47.128 0 C 48.154 0 48.658 1.247 47.921 1.96 L 18.984 29.908 C 18.556 30.321 18.518 30.993 18.896 31.452 L 46.514 64.99 C 47.126 65.734 46.597 66.855 45.633 66.855 L 29.635 66.855 C 29.286 66.855 28.957 66.696 28.74 66.422 L 8.571 40.952 C 8.569 40.951 8.567 40.95 8.565 40.952 C 8.563 40.954 8.56 40.954 8.559 40.952 L 0.265 31.011 Z" fill={color} fillRule="nonzero"/>
  </svg>
);

// Renders *text* as italic spans; \n respected via whiteSpace: pre-line on parent
const inlineItalic = (text) => (text || '').split('*').map((seg, i) =>
  i % 2 === 0
    ? <React.Fragment key={i}>{seg}</React.Fragment>
    : <em key={i} style={{ fontStyle: 'italic' }}>{seg}</em>
);

// ─── BUTTON ───────────────────────────────────────────────────────────────────
function KButton({ variant = 'ink', children, href, onClick, size = 'md', icon, style }) {
  const sizes = {
    sm: { padding: '10px 18px', fontSize: 11 },
    md: { padding: '14px 24px', fontSize: 12.5 },
    lg: { padding: '18px 30px', fontSize: 13.5 },
  };
  const variants = {
    ink:      { background: '#0A0A0A', color: '#fff', border: '1px solid #0A0A0A' },
    charcoal: { background: '#1F1F1F', color: '#fff', border: '1px solid #1F1F1F' },
    seafoam:  { background: '#6CF7C5', color: '#0A0A0A', border: '1px solid #6CF7C5' },
    outline:  { background: 'transparent', color: '#1F1F1F', border: '1px solid #1F1F1F' },
    outlineW: { background: 'transparent', color: '#fff', border: '1px solid #fff' },
    text:     { background: 'transparent', color: '#0A0A0A', border: '0', textDecoration: 'underline', textUnderlineOffset: 4, padding: '14px 4px' },
    textW:    { background: 'transparent', color: '#fff', border: '0', textDecoration: 'underline', textUnderlineOffset: 4, padding: '14px 4px' },
  };
  const Tag = href ? 'a' : 'button';
  return (
    <Tag href={href} onClick={onClick} style={{
      fontFamily: 'Proxima Nova', fontWeight: 700,
      letterSpacing: '0.15em', textTransform: 'uppercase',
      borderRadius: 7, cursor: 'pointer',
      display: 'inline-flex', alignItems: 'center', gap: 10,
      transition: 'transform 120ms, background 200ms, opacity 200ms',
      textDecoration: variants[variant].textDecoration || 'none',
      textUnderlineOffset: variants[variant].textUnderlineOffset,
      whiteSpace: 'nowrap',
      ...sizes[size], ...variants[variant], ...style,
    }}>
      {children}{icon}
    </Tag>
  );
}

// ─── NAV ──────────────────────────────────────────────────────────────────────
function KNav({ theme = 'light' }) {
  const isDark = theme === 'dark';
  const linkColor = isDark ? '#fff' : '#0A0A0A';
  const link = {
    fontFamily: 'Proxima Nova', fontWeight: 700, fontSize: 12.5,
    letterSpacing: '0.15em', textTransform: 'uppercase',
    color: linkColor, textDecoration: 'none', cursor: 'pointer',
    display: 'inline-flex', alignItems: 'center', gap: 6,
  };
  const caret = <span style={{ fontSize: 9, opacity: 0.7 }}>▾</span>;
  return (
    <nav style={{
      display: 'flex', alignItems: 'center',
      padding: '24px 64px', gap: 48,
      borderBottom: isDark ? '1px solid rgba(255,255,255,0.08)' : '1px solid rgba(10,10,10,0.06)',
    }}>
      <img src={isDark ? ASSETS.wordmarkWhite : ASSETS.wordmarkBlack} height={22} alt="Klue" style={{ display: 'block' }}/>
      <div style={{ display: 'flex', gap: 36 }}>
        <a style={link}>Product {caret}</a>
        <a style={link}>Resources {caret}</a>
        <a style={link}>Company {caret}</a>
      </div>
      <div style={{ marginLeft: 'auto', display: 'flex', gap: 16, alignItems: 'center' }}>
        <a style={{ ...link, fontSize: 12 }}>Login</a>
        <KButton variant={isDark ? 'seafoam' : 'ink'} size="sm">Get a Demo</KButton>
      </div>
    </nav>
  );
}

// ─── EYEBROW ──────────────────────────────────────────────────────────────────
function Eyebrow({ children, color = '#0A0A0A', style }) {
  return (
    <div style={{
      fontFamily: 'Proxima Nova', fontWeight: 600,
      fontSize: 13, letterSpacing: '0.18em', textTransform: 'uppercase',
      color, ...style,
    }}>{children}</div>
  );
}

// ─── WIDGET SUB-CARDS ─────────────────────────────────────────────────────────
function WidgetTip({ stage, priority, title, body, source }) {
  const isHigh = priority === 'High';
  return (
    <div style={{ background: '#fff', borderRadius: 8, padding: '12px 14px', border: '1px solid #EAEAEA', display: 'flex', flexDirection: 'column', gap: 4 }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 2 }}>
        <span style={{ fontSize: 9.5, fontWeight: 700, letterSpacing: '0.1em', padding: '2px 7px', borderRadius: 3, background: '#E1F4FF', color: '#0B5C8A' }}>{stage}</span>
        <span style={{ fontSize: 9.5, fontWeight: 700, letterSpacing: '0.08em', textTransform: 'uppercase', padding: '2px 7px', borderRadius: 3, background: isHigh ? '#FFF2F3' : '#FFF7E3', color: isHigh ? '#EB111C' : '#E18700' }}>{priority} priority</span>
      </div>
      <div style={{ fontWeight: 700, fontSize: 13, color: '#0A0A0A', lineHeight: 1.3 }}>{title}</div>
      <div style={{ fontSize: 12, color: '#464646', lineHeight: 1.4 }}>{body}</div>
      <div style={{ fontSize: 10.5, color: '#9A9A9A', marginTop: 2, display: 'flex', alignItems: 'center', gap: 4 }}>
        <span>↗</span> {source}
      </div>
    </div>
  );
}

function WidgetWL({ outcome, company, rep, snippet }) {
  const won = outcome === 'WON';
  return (
    <div style={{ background: '#fff', borderRadius: 8, padding: '12px 14px', border: '1px solid #EAEAEA', display: 'flex', gap: 12, alignItems: 'flex-start' }}>
      <div style={{ flexShrink: 0, fontSize: 9.5, fontWeight: 800, letterSpacing: '0.08em', padding: '4px 8px', borderRadius: 4, background: won ? '#1EB158' : '#0A0A0A', color: '#fff' }}>{outcome}</div>
      <div style={{ flex: 1 }}>
        <div style={{ fontSize: 11.5, color: '#717171', marginBottom: 2 }}>{company} · {rep}</div>
        <div style={{ fontFamily: 'Family', fontSize: 13.5, color: '#0A0A0A', fontStyle: 'italic', lineHeight: 1.4 }}>{snippet}</div>
      </div>
    </div>
  );
}

function WidgetProof({ logoLetter, company, stat, note }) {
  return (
    <div style={{ background: '#fff', borderRadius: 8, padding: '12px 14px', border: '1px solid #EAEAEA', display: 'flex', gap: 12, alignItems: 'center' }}>
      <div style={{ width: 36, height: 36, borderRadius: 8, background: '#E1F4FF', color: '#0B5C8A', display: 'flex', alignItems: 'center', justifyContent: 'center', fontFamily: 'Family', fontSize: 18 }}>{logoLetter}</div>
      <div style={{ flex: 1 }}>
        <div style={{ fontSize: 11.5, color: '#717171' }}>{company}</div>
        <div style={{ fontWeight: 700, fontSize: 13.5, color: '#0A0A0A' }}>{stat}</div>
        <div style={{ fontSize: 11, color: '#717171', marginTop: 2 }}>{note}</div>
      </div>
    </div>
  );
}

// ─── CALLOUT (numbered feature) ───────────────────────────────────────────────
function Callout({ num, label, title, body }) {
  return (
    <div style={{ display: 'flex', gap: 24 }}>
      <div style={{ flexShrink: 0, width: 52, height: 52, borderRadius: 12, background: '#E1F4FF', color: '#0B5C8A', display: 'flex', alignItems: 'center', justifyContent: 'center', fontFamily: 'Proxima Nova', fontWeight: 800, fontSize: 18, letterSpacing: '0.04em' }}>{num}</div>
      <div style={{ flex: 1 }}>
        <div style={{ fontFamily: 'Proxima Nova', fontWeight: 700, fontSize: 11.5, letterSpacing: '0.16em', textTransform: 'uppercase', color: '#0B5C8A', marginBottom: 8 }}>{label}</div>
        <h3 style={{ fontFamily: 'Family', fontWeight: 400, fontSize: 28, lineHeight: 1.15, color: '#0A0A0A', margin: '0 0 12px' }}>{title}</h3>
        <p style={{ fontSize: 15.5, color: '#464646', lineHeight: 1.55, margin: 0 }}>{body}</p>
      </div>
    </div>
  );
}

// ─── FOOTER ───────────────────────────────────────────────────────────────────
function KFooter() {
  const link = { fontFamily: 'Proxima Nova', fontWeight: 400, fontSize: 15, color: '#fff', lineHeight: 1.7, textDecoration: 'none', display: 'inline-block' };
  const head = { fontFamily: 'Proxima Nova', fontWeight: 700, fontSize: 17, color: '#00CCFF', marginBottom: 22 };
  const cols = [
    ['Product', [
      ['Klue Compete'], ['Klue Win Loss'], ['Integrations'], ['AI Capabilities'], ['Security'],
    ]],
    ['Resources', [
      ['Articles & Resources'], ['Customer Stories'], ['Events'],
    ]],
    ['Company', [
      ['About'], ['Careers', { badge: "We're Hiring" }], ['Contact'], ['News & Press'], ['Hey AI, learn about us'],
    ]],
    ['Topics', [
      ['7 Leading Platforms for Competitive Sales Enablement in 2026'],
      ['How to Create Effective Sales Battlecards That Win Deals in 2026'],
      ['Good Sales Battlecard Examples: What Works and Why in 2026'],
      ['How to Conduct a Competitive Analysis on Top Rivals (2026 Guide)'],
      ['10 Best AI Tools for Competitor Analysis in 2026'],
    ]],
  ];
  const socials = [
    { name: 'Instagram', icon: 'ph-instagram-logo' },
    { name: 'LinkedIn',  icon: 'ph-linkedin-logo' },
    { name: 'Twitter',   icon: 'ph-twitter-logo' },
    { name: 'Email',     icon: 'ph-envelope-simple' },
  ];
  return (
    <footer style={{ background: '#0A0A0A', color: '#fff', paddingBottom: 56 }}>
      {/* CTA + demo video */}
      <div style={{ padding: '120px 80px 100px' }}>
        <div style={{ maxWidth: 1440, margin: '0 auto', display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 80, alignItems: 'center' }}>
          <div>
            <h2 style={{ fontFamily: 'Proxima Nova', fontWeight: 800, fontSize: 72, lineHeight: 1.0, letterSpacing: '-0.01em', color: '#fff', margin: 0 }}>
              Want to see <span style={{ color: '#00CCFF' }}>Klue in action?</span>
            </h2>
            <p style={{ fontFamily: 'Proxima Nova', fontSize: 18, lineHeight: 1.5, color: '#fff', margin: '28px 0 48px', maxWidth: 460 }}>
              Let's do it. Tell us a bit about yourself and we'll set up a time to wow you.
            </p>
            <a href="#" style={{ display: 'inline-block', fontFamily: 'Proxima Nova', fontWeight: 700, fontSize: 13, letterSpacing: '0.15em', textTransform: 'uppercase', color: '#0A0A0A', background: '#00CCFF', padding: '18px 30px', borderRadius: 7, textDecoration: 'none', cursor: 'pointer' }}>Get a Demo</a>
          </div>
          <video src={ASSETS.demoVideo} autoPlay muted loop playsInline style={{ width: '100%', aspectRatio: '16 / 11', display: 'block', background: '#1F1F1F', borderRadius: 8, objectFit: 'cover' }}/>
        </div>
      </div>

      {/* Link columns */}
      <div style={{ maxWidth: 1440, margin: '0 auto', padding: '0 80px' }}>
        <div style={{ display: 'grid', gridTemplateColumns: '1.05fr 1.15fr 1.2fr 2fr 1fr', gap: 56 }}>
          {cols.map(([heading, items]) => (
            <div key={heading}>
              <div style={head}>{heading}</div>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
                {items.map(([label, opts]) => (
                  <div key={label} style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                    <a href="#" style={link}>{label}</a>
                    {opts?.badge && (
                      <span style={{ fontFamily: 'Proxima Nova', fontWeight: 600, fontSize: 12, color: '#00CCFF', border: '1px solid #00CCFF', borderRadius: 6, padding: '3px 8px', whiteSpace: 'nowrap' }}>{opts.badge}</span>
                    )}
                  </div>
                ))}
              </div>
            </div>
          ))}
          <div>
            <div style={head}>Follow Us On</div>
            <div style={{ display: 'flex', gap: 22, marginTop: 4 }}>
              {socials.map(s => (
                <a key={s.name} href="#" aria-label={s.name} style={{ color: '#fff', textDecoration: 'none' }}>
                  <i className={'ph ' + s.icon} style={{ fontSize: 28 }}/>
                </a>
              ))}
            </div>
          </div>
        </div>

        {/* Bottom row: wordmark · mascot slot · meta */}
        <div style={{ display: 'grid', gridTemplateColumns: '1.4fr auto 1.4fr', gap: 32, alignItems: 'end', marginTop: 80, paddingTop: 24 }}>
          <img src={ASSETS.wordmarkWhite} alt="Klue" style={{ height: 120, display: 'block', justifySelf: 'start' }}/>
          <image-slot id="footer-mascot" placeholder="Drop Klue scuba mascot" style={{ width: 180, height: 240, background: 'transparent', justifySelf: 'center' }}></image-slot>
          <div style={{ display: 'flex', alignItems: 'center', gap: 32, justifySelf: 'end', flexWrap: 'wrap', fontFamily: 'Proxima Nova', fontSize: 15, color: '#fff', paddingBottom: 24 }}>
            <a href="#" style={{ color: 'inherit', textDecoration: 'none' }}>Status</a>
            <a href="#" style={{ color: 'inherit', textDecoration: 'none' }}>Media Kit</a>
            <a href="#" style={{ color: 'inherit', textDecoration: 'none' }}>Privacy</a>
            <span style={{ color: 'rgba(255,255,255,0.3)' }}>|</span>
            <span style={{ color: 'rgba(255,255,255,0.65)' }}>© 2026 Klue Labs · Vancouver, BC</span>
          </div>
        </div>
      </div>
    </footer>
  );
}

// ─── LANDING PAGE ─────────────────────────────────────────────────────────────
function LandingPage() {
  const heroHeadline     = 'Your CRM, finally worth opening.';
  const problemStatement = "Your reps are spending 20–30 on pre-call prep bouncing between multiple tools.\nThat's time they could be *running another discovery call* or *advancing a different deal*.";
  const ctaLabel         = 'See How It Works';

  return (
    <div style={{ background: '#fff', fontFamily: 'Proxima Nova', color: '#0A0A0A' }}>

      {/* ── NAV + HERO (cyan) ─────────────────────────────────────────── */}
      <div style={{ background: '#00CCFF' }}>
        <KNav theme="light"/>

        <section style={{ padding: '64px 80px 96px', textAlign: 'center' }}>
          <Eyebrow style={{ marginBottom: 24, opacity: 0.78 }}>Introducing · Compete Widget 2.0</Eyebrow>
          <h1 style={{ fontFamily: 'Family', fontWeight: 400, fontSize: 92, lineHeight: 0.98, letterSpacing: '-0.01em', color: '#0A0A0A', margin: '0 auto', maxWidth: 1080 }}>
            {heroHeadline}
          </h1>
          <p style={{ fontFamily: 'Proxima Nova', fontSize: 19, lineHeight: 1.45, color: '#0A0A0A', maxWidth: 660, margin: '28px auto 0', opacity: 0.85 }}>
            Compete Widget 2.0 brings deal-specific intelligence — deal tips, win/loss stories, and customer proof — straight into the opportunity your reps are already working in.
          </p>
          <div style={{ marginTop: 36, display: 'flex', gap: 8, justifyContent: 'center', alignItems: 'center' }}>
            <KButton variant="ink" size="lg" style={{ textAlign: 'center' }}>{ctaLabel}</KButton>
          </div>
        </section>

        {/* Hero screenshot with mascot peeking above top-left */}
        <div style={{ padding: '0 80px', marginBottom: -180, position: 'relative', zIndex: 2 }}>
          {/*
            The mascot (338×462px source) is rendered at width 250px → ~342px tall.
            `bottom: 100%` puts the mascot's bottom at the container's top edge.
            `marginBottom: -110px` shifts it back down so ~110px of legs are hidden
            behind the hero image, leaving ~232px of upper body visible above.
            z-index 1 (behind the screenshot's z-index 2) completes the tuck.
          */}
          <img
            src={ASSETS.mascot}
            alt=""
            aria-hidden="true"
            style={{
              position: 'absolute',
              left: 120,                        /* ~40px from inner left edge after 80px padding */
              bottom: '100%',
              marginBottom: -110,               /* hide lower 110px (legs) behind image */
              width: 250,
              zIndex: 1,
              filter: 'drop-shadow(0 8px 24px rgba(0,0,0,0.28))',
              pointerEvents: 'none',
            }}
          />
          <img
            src={ASSETS.sfWidget}
            alt="Compete Widget 2.0 inside a Salesforce opportunity"
            style={{
              position: 'relative',
              display: 'block', width: '100%', height: 'auto',
              borderRadius: 14,
              border: '1px solid rgba(10,10,10,0.06)',
              boxShadow: '0 36px 80px -20px rgba(1,22,39,0.32), 0 4px 12px rgba(1,22,39,0.06)',
              background: '#fff',
              zIndex: 2,
            }}
          />
        </div>
      </div>

      {/* Spacer to accommodate floating screenshot overlap */}
      <div style={{ background: '#fff', height: 240 }}/>

      {/* ── PROBLEM (ink) ─────────────────────────────────────────────── */}
      <section style={{ background: '#0A0A0A', color: '#fff', padding: '140px 80px' }}>
        <div style={{ maxWidth: 1080, margin: '0 auto', textAlign: 'center' }}>
          <Eyebrow color="#00CCFF" style={{ marginBottom: 32 }}>The Problem</Eyebrow>
          <h2 style={{ fontFamily: 'Family', fontWeight: 400, fontSize: 50, lineHeight: 1.15, letterSpacing: '-0.005em', color: '#fff', margin: 0, textWrap: 'balance', whiteSpace: 'pre-line' }}>
            {inlineItalic(problemStatement)}
          </h2>
        </div>
      </section>

      {/* ── HOW IT WORKS ──────────────────────────────────────────────── */}
      <section style={{ background: '#fff', padding: '140px 80px' }}>
        <div style={{ maxWidth: 1280, margin: '0 auto' }}>
          <div style={{ textAlign: 'center', maxWidth: 880, margin: '0 auto 80px' }}>
            <Eyebrow>How It Works</Eyebrow>
            <h2 style={{ fontFamily: 'Family', fontWeight: 400, fontSize: 56, lineHeight: 1.02, marginTop: 20, marginBottom: 20 }}>
              Everything they need to win.<br/>
              Right where they're already working.
            </h2>
            <p style={{ fontSize: 17, lineHeight: 1.55, color: '#464646', margin: 0 }}>
              The Compete Widget 2.0 surfaces deal-specific context inside the Salesforce opportunity — no tabs, no searching, no "let me get back to you on that."
            </p>
          </div>

          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1.05fr', gap: 80, alignItems: 'center' }}>
            {/* Callouts */}
            <div style={{ display: 'flex', flexDirection: 'column', gap: 40 }}>
              <Callout
                num="01"
                label="Proof Points"
                title="The right proof, on the right deal."
                body="Klue pulls customer quotes, case studies, and competitive intel that match the buyer's industry and segment - no more digging through Slack or guessing what'll land."
              />
              <Callout
                num="02"
                label="Deal Tips"
                title="Coaching that knows the deal."
                body="Stage-aware, competitor-aware tips that show up in the opportunity record - built from holistic competitive intel and the moves your top reps have already made."
              />
            </div>

            {/* High-res widget panel screenshot with cyan glow */}
            <div style={{ position: 'relative' }}>
              <div style={{ position: 'absolute', inset: -32, background: 'radial-gradient(ellipse, rgba(0,204,255,0.18) 0%, rgba(0,204,255,0) 70%)', filter: 'blur(40px)', pointerEvents: 'none' }}/>
              <img
                src={ASSETS.widgetPanel}
                alt="Klue Compete widget showing Proof Points and Deal Tips"
                style={{ position: 'relative', display: 'block', width: '100%', height: 'auto', borderRadius: 10, background: '#fff' }}
              />
            </div>
          </div>
        </div>
      </section>

      <KFooter/>
    </div>
  );
}

// ─── MOUNT ────────────────────────────────────────────────────────────────────
ReactDOM.createRoot(document.getElementById('root')).render(<LandingPage/>);
</script>
</body>
</html>
